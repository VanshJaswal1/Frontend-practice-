<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Tags in HTML</title>
</head>
<body>

    <h1>Calendar Tags in HTML</h1>

    <form>

        <fieldset>
            <legend><b>Calendar Input Form</b></legend>

            <br>

            <label>Select Date:</label>
            <input type="date">

            <br><br>

            <label>Select Time:</label>
            <input type="time">

            <br><br>

            <label>Select Date and Time:</label>
            <input type="datetime-local">

            <br><br>

            <label>Select Month:</label>
            <input type="month">

            <br><br>

            <label>Select Week:</label>
            <input type="week">

            <br><br>

            <label>Select Birthday:</label>
            <input type="date">

            <br><br>

            <label>Choose Meeting Time:</label>
            <input type="time">

            <br><br>

            <input type="submit" value="Submit">

            <input type="reset" value="Reset">

        </fieldset>

    </form>

</body>
</html>
