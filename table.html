<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in HTML</title>
</head>
<body>

    <h1><i>Table in HTML</i></h1>

    <table border="2"
           align="center"
           bgcolor="pink"
           cellpadding="15"
           cellspacing="5"
           width="700"
           height="300">

        <thead>

            <tr bgcolor="yellow" align="center">

                <th rowspan="2" width="150">
                    Name
                </th>

                <th colspan="2">
                    Marks
                </th>

                <th rowspan="2">
                    GF Name
                </th>

            </tr>

            <tr bgcolor="lightblue" align="center">
                <th>HTML</th>
                <th>CSS</th>
            </tr>

        </thead>

        <tbody>

            <tr bgcolor="red" align="center">

                <td>Vansh</td>
                <td>100</td>
                <td>95</td>
                <td>None</td>

            </tr>

            <tr bgcolor="orange" align="center">

                <td>Devansh</td>
                <td>98</td>
                <td>99</td>
                <td>Kirti</td>

            </tr>

            <tr bgcolor="lightgreen" align="center">

                <td>Ayush</td>
                <td>97</td>
                <td>94</td>
                <td>Aayu</td>

            </tr>

        </tbody>

    </table>

</body>
</html>
