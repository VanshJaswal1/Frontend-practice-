<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superscript and Subscript</title>
</head>
<body>

    <h1>Superscript </h1>

    <p>x<sup>2</sup></p>
    <p>(a + b)<sup>2</sup></p>

    <h1>Subscript E</h1>

    <p>H<sub>2</sub>O</p>
    <p>CO<sub>2</sub></p>

</body>
</html>
