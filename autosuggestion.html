<!DOCTYPE html>
<html>
<body>

<h2>Auto Suggestion Example</h2>

<input list="fruits" placeholder="Type a fruit">

<datalist id="fruits">
    <option value="Apple">
    <option value="Banana">
    <option value="Mango">
    <option value="Orange">
    <option value="Pineapple">
</datalist>

</body>
</html>
