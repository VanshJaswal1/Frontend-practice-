        .box{
    height:500px;
    width:500px;
    border:5px solid black;
    position:relative;
    overflow:hidden;
}


.button{
    position:absolute;
    left:0px;
    bottom:-50px;

    width:100%;
    height:50px;

    background-color:gold;
    border:none;
    font-size:20px;

    opacity:0;
    transition:1s;
}

.box:hover .button{
    bottom:0;
    opacity:1;
}
    </style>
</head>
<body>
    <div class="box"> 

    <img src="pic2.png" height="100%" width="100%" >
    <input type="button" name="" value="add to cart" class="button">

    </div>
